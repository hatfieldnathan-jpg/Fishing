<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ultimate Fishing</title>
<style>
body,html{margin:0;padding:0;overflow:hidden;background:#5ca8ff;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;user-select:none;touch-action:none}
#game-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#loading-screen{position:absolute;inset:0;background:#0a0f19;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .8s ease}
#loading-screen h1{margin:0;font-size:36px;text-transform:uppercase;letter-spacing:4px;background:linear-gradient(90deg,#00c6ff,#0072ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#loading-text{margin:5px 0 30px;color:#888;font-size:16px;letter-spacing:2px}
.water-wave{animation:wave 2s infinite ease-in-out}.fishing-line-anim{animation:pull 2s infinite ease-in-out}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pull{0%,100%{y2:150}50%{y2:130}}
@keyframes loadbar{0%{width:0}100%{width:100%}}
#ui-layer{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s}
#hud{position:absolute;top:20px;left:20px;background:rgba(15,25,35,.6);backdrop-filter:blur(12px);color:#fff;padding:15px 25px;border-radius:16px;border:1px solid rgba(255,255,255,.1);font-weight:bold;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.8)}
#interaction-msg{position:absolute;top:25%;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;padding:10px 30px;border-radius:25px;font-weight:900;font-size:18px;display:none;box-shadow:0 4px 15px rgba(255,215,0,.6);text-transform:uppercase;letter-spacing:2px}
#joystick-zone{position:absolute;bottom:30px;left:30px;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%;border:2px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);pointer-events:auto}
#joystick-knob{position:absolute;top:45px;left:45px;width:50px;height:50px;background:rgba(255,255,255,.9);border-radius:50%;pointer-events:none;box-shadow:0 4px 15px rgba(0,0,0,.5)}
#action-btn{position:absolute;bottom:40px;right:40px;width:110px;height:110px;background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;border-radius:50%;border:4px solid rgba(255,255,255,.8);font-weight:bold;font-size:18px;box-shadow:0 8px 25px rgba(0,114,255,.6);pointer-events:auto;cursor:pointer;transition:transform .1s;text-shadow:1px 1px 2px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;text-align:center}
#action-btn:active{transform:scale(.9)}
#minigame-container{position:absolute;top:50%;right:8%;transform:translateY(-50%);width:40px;height:350px;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);border:2px solid #444;border-radius:20px;display:none;pointer-events:none;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,.8)}
#catch-bar{position:absolute;bottom:0;left:4px;width:32px;height:80px;background:rgba(0,255,0,.5);border:2px solid lime;border-radius:10px}
#fish-line{position:absolute;bottom:0;left:0;width:100%;height:8px;background:#ff3333;box-shadow:0 0 10px red;border-radius:4px}
#progress-container{position:absolute;top:50%;right:calc(8% + 60px);transform:translateY(-50%);width:15px;height:350px;background:rgba(0,0,0,.7);border:1px solid #444;border-radius:10px;display:none;overflow:hidden}
#progress-fill{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(to top,#ff9900,#00ff00);border-radius:8px}
.modal{position:absolute;top:5%;left:5%;width:90%;height:90%;background:rgba(10,15,25,.95);backdrop-filter:blur(20px);color:#fff;border-radius:20px;border:1px solid rgba(0,198,255,.3);display:none;pointer-events:auto;overflow-y:auto;padding:25px;box-sizing:border-box;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.9)}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:15px;margin-bottom:20px}
.modal-header h2{margin:0;flex-grow:1;text-align:center}
.close-btn{background:rgba(255,68,68,.2);color:#ff4444;border:1px solid #ff4444;padding:8px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;transition:.2s}
.close-btn:hover{background:#ff4444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px}
.card{background:rgba(255,255,255,.03);padding:15px;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,.05);transition:transform .2s,background .2s;display:flex;flex-direction:column;justify-content:space-between}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.card button{margin-top:15px;padding:10px 15px;width:100%;background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.card button.equip-btn{background:linear-gradient(135deg,#11998e,#38ef7d)}
.card button:disabled{background:#555;color:#aaa;cursor:default}
#catch-popup{position:absolute;inset:0;display:none;pointer-events:none;z-index:20}
#caught-header{position:absolute;top:12%;left:50%;transform:translateX(-50%);text-align:center;background:rgba(15,25,35,.85);backdrop-filter:blur(10px);padding:15px 40px;border-radius:20px;border:2px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:auto;width:max-content}
#caught-button-container{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);pointer-events:auto}
.rarity-Common{color:#B0BEC5}.rarity-Uncommon{color:#81C784}.rarity-Rare{color:#64B5F6}
.rarity-ExtraRare{color:#BA68C8;text-shadow:0 0 8px rgba(186,104,200,.5)}.rarity-Epic{color:#F06292;text-shadow:0 0 12px rgba(240,98,146,.6)}
.rarity-Legendary{color:#FFD54F;text-shadow:0 0 15px rgba(255,213,79,.8)}.rarity-Exotic{color:#0ff;text-shadow:0 0 20px #0ff;font-weight:900;letter-spacing:1px}
#alert-box{position:absolute;top:15%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);backdrop-filter:blur(5px);color:#fff;padding:15px 30px;border-radius:12px;font-size:18px;font-weight:bold;text-align:center;display:none;pointer-events:none;z-index:5;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 20px rgba(0,0,0,.5)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        <div id="shop-modal" class="modal">

const fishDatabase = rawFishData.map(f => ({

    scale: (f[1] === 'Common' || f[1] === 'Uncommon') ? f[7] * 8.25 : f[7]

let fishIndex = {}; fishDatabase.forEach(f => fishIndex[f.name] = 0);

// --- SAVE / LOAD ---
const SAVE_KEY = 'ultimateFishingSaveLite';
function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({money, inventory, fishIndex, totalCaughtCount, rodsOwned: rods.map(r => r.owned), currentRodIndex})); } catch (e) {}
    updateHUD();
}
function loadGame() {
    try {
        const saved = localStorage.getItem(SAVE_KEY); if (!saved) return;
        const d = JSON.parse(saved);
        money = d.money || 0; inventory = d.inventory || [];
        if (d.fishIndex) Object.keys(d.fishIndex).forEach(k => { if (fishIndex[k] !== undefined) fishIndex[k] = d.fishIndex[k]; });
        totalCaughtCount = d.totalCaughtCount || 0;
        if (d.rodsOwned) d.rodsOwned.forEach((o, i) => { if (rods[i]) rods[i].owned = o; });
        currentRodIndex = d.currentRodIndex || 0;
    } catch (e) { console.error('Corrupted save data.', e); }
}
loadGame();

const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const HORIZON = 0xcfe4f2;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(HORIZON, 0.008);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1500);
camera.position.set(0, 2, 0);
scene.add(camera);

// Lighting
const SUN_DIR = new THREE.Vector3(0.45, 0.55, -0.7).normalize();
scene.add(new THREE.HemisphereLight(0xbfdcff, 0x8a7a5a, 0.75));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.9);
sun.position.copy(SUN_DIR).multiplyScalar(60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 140 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

// Sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({

let sardineTemplate = null;               // normalized holder (longest dimension == 1, centred on origin)
const SARDINE_EXTRA_SCALE = 1.0;          // bump this up/down if you want the sardine bigger/smaller
const SARDINE_ROTATION = new THREE.Euler(0, Math.PI / 2, 0); // tweak if the model faces the wrong way

(function loadSardineModel() {
    const loader = new THREE.GLTFLoader();
    // "scene.glb" sits next to index.html — relative path works on GitHub Pages
    loader.load('scene.glb', (gltf) => {
        const model = gltf.scene;

        // orient the model first so the bounding box is measured correctly
        model.rotation.copy(SARDINE_ROTATION);
        model.updateMatrixWorld(true);

        // measure it
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3(); box.getSize(size);
        const center = new THREE.Vector3(); box.getCenter(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;

        // normalise: scale so the longest side is exactly 1, and centre it on the origin
        const k = 1 / maxDim;
        model.scale.setScalar(k);
        model.position.set(-center.x * k, -center.y * k, -center.z * k);

        // disable frustum culling on every mesh (the popup fish sits right in front of the camera)
        model.traverse(o => {
            if (o.isMesh) {
                o.frustumCulled = false;
                o.castShadow = false;
                o.receiveShadow = false;
                if (o.material) o.material.side = THREE.FrontSide;
            }
        });

        // holder group so that later we can just clone + scale uniformly
        sardineTemplate = new THREE.Group();
        sardineTemplate.add(model);

        console.log('✅ scene.glb loaded — Sardine now uses the custom model (max dim normalised to 1).');
    },
    undefined,
    (err) => {
        console.warn('⚠️ Could not load scene.glb — falling back to the procedural sardine.', err);
    });
})();

function create3DFish(d) {
    // ---- Sardine: use the custom scene.glb model if it loaded ----
    if (d.name === 'Sardine' && sardineTemplate) {
        const g = new THREE.Group();
        const inst = sardineTemplate.clone(true);

        // the procedural body is a radius-1 sphere scaled by (px,py,pz),
        // so its raw longest side is 2 * max(prop). Match that exactly.
        const rawSize = 2 * Math.max(...d.prop) * SARDINE_EXTRA_SCALE;
        inst.scale.setScalar(rawSize);

        g.add(inst);
        g.scale.setScalar(d.scale);   // the popup overrides this anyway, keeping size consistent
        g.userData.tail = null;       // no procedural tail to animate
        return g;
    }

    // ---- Default procedural fish ----
    const g = new THREE.Group(), [px, py, pz] = d.prop;
    const mat = new THREE.MeshStandardMaterial({ map: fishTexture(d.c1, d.c2, d.pat), metalness: 0.3, roughness: 0.45, side: THREE.DoubleSide });
    if (d.id === 'Exotic') { mat.emissive = new THREE.Color(d.c2); mat.emissiveIntensity = 0.3; }
    const body = new THREE.Mesh(fishBodyGeo, mat); body.scale.set(px, py, pz); g.add(body);
    // forked tail on pivot
    const tail = new THREE.Group(); tail.position.z = -pz * 0.85;
    for (const s of [1, -1]) {
        const lobe = new THREE.Mesh(finGeo, mat); lobe.scale.set(0.15, Math.max(py, 0.35) * 1.1, 1);
        lobe.rotation.x = -Math.PI / 2; lobe.rotation.y = 0; lobe.position.set(0, s * py * 0.45, -0.35); lobe.rotation.z = 0;
        lobe.rotateX(s * 0.35); tail.add(lobe);
    }
    g.add(tail); g.userData.tail = tail;
    const dorsal = new THREE.Mesh(finGeo, mat); dorsal.scale.set(0.12, py * 1.1, pz * 0.8); dorsal.position.set(0, py * 0.95, -pz * 0.05); dorsal.rotation.x = -0.15; g.add(dorsal);
    for (const s of [1, -1]) {
        const pf = new THREE.Mesh(finGeo, mat); pf.scale.set(0.3, 0.35, 0.5); pf.position.set(s * px * 0.85, -py * 0.25, pz * 0.25); pf.rotation.set(0.4, 0, s * 1.3); g.add(pf);
        const eye = new THREE.Group(); eye.add(new THREE.Mesh(eyeGeo, eyeWhite));
        const pup = new THREE.Mesh(pupilGeo, eyeBlack); pup.position.x = 0.06 * s; eye.add(pup);
        eye.scale.setScalar(Math.max(0.8, Math.min(px, py) * 1.6));
        eye.position.set(s * px * 0.72, py * 0.22, pz * 0.62); g.add(eye);
    }
    g.scale.setScalar(d.scale);
    return g;
}

function splash(p, n) {
    for (let k = 0; k < n; k++) {
        const i = spCursor++ % SP_N, a = Math.random() * 6.28, s = 0.5 + Math.random() * 1.8;
        spPos.set([p.x, p.y, p.z], i * 3); spVel.set([Math.cos(a) * s, 3 + Math.random() * 3, Math.sin(a) * s], i * 3); spLife[i] = 1;
    }
}

// --- CONTROLS ---
let moveVector = { x: 0, y: 0 }, cameraAngles = { yaw: 0, pitch: 0 };
let isDragging = false, prevTouch = { x: 0, y: 0 }, joyId = null;
const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');
joyZone.addEventListener('touchstart', e => { if (joyId === null) { joyId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); } });
joyZone.addEventListener('touchmove', e => { for (let t of e.changedTouches) if (t.identifier === joyId) { updateJoy(t); e.preventDefault(); } }, { passive: false });
const endJoy = e => { for (let t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyKnob.style.transform = 'translate(0px,0px)'; moveVector = { x: 0, y: 0 }; } };
joyZone.addEventListener('touchend', endJoy); joyZone.addEventListener('touchcancel', endJoy);
function updateJoy(t) {
    const r = joyZone.getBoundingClientRect();
    let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy), max = r.width / 2;
    if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
    joyKnob.style.transform = `translate(${dx}px,${dy}px)`; moveVector.x = dx / max; moveVector.y = dy / max;
}
function doCameraLook(dx, dy) {
    cameraAngles.yaw -= dx * 0.005; cameraAngles.pitch -= dy * 0.005;
    cameraAngles.pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraAngles.pitch));
    camera.quaternion.setFromEuler(new THREE.Euler(cameraAngles.pitch, cameraAngles.yaw, 0, 'YXZ'));
}
document.addEventListener('touchstart', e => { if (e.target.id === 'game-canvas' && e.touches[0].clientX > window.innerWidth / 2) { isDragging = true; prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } });
document.addEventListener('touchmove', e => { if (isDragging && e.target.id === 'game-canvas') { doCameraLook(e.touches[0].clientX - prevTouch.x, e.touches[0].clientY - prevTouch.y); prevTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } }, { passive: false });
document.addEventListener('touchend', () => isDragging = false);
let keys = { w: false, a: false, s: false, d: false }, isMouseDown = false;
document.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });
document.addEventListener('mousedown', e => { isMouseDown = true; prevTouch = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mousemove', e => { if (isMouseDown && e.target.id === 'game-canvas') { doCameraLook(e.clientX - prevTouch.x, e.clientY - prevTouch.y); prevTouch = { x: e.clientX, y: e.clientY }; } });
document.addEventListener('mouseup', () => isMouseDown = false);

// --- GAME STATE ---
const actionBtn = document.getElementById('action-btn'), msg = document.getElementById('interaction-msg');
let state = 'idle', hookTimeout = null, targetFish = null;
let barPos = 0, fishPos = 150, catchProgress = 0, isHoldingReel = false, fishTarget = 150, popupFishMesh = null;
actionBtn.addEventListener('mousedown', handleBtnDown); actionBtn.addEventListener('touchstart', handleBtnDown);
actionBtn.addEventListener('mouseup', handleBtnUp); actionBtn.addEventListener('touchend', handleBtnUp);

function handleBtnDown(e) {
    e.preventDefault();
    if (state === 'near_shop') { openShop(); return; }
    if (state === 'near_sell') { openSell(); return; }
    if (state === 'minigame') { isHoldingReel = true; return; }
    if (state === 'idle') {
        if (Math.abs(camera.position.z) > 8 || Math.abs(camera.position.x) > 8) {
            state = 'casting'; actionBtn.innerText = 'WAIT'; actionBtn.style.background = '#555';
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
            fishingLine.userData.target = camera.position.clone().add(dir.multiplyScalar(12)); fishingLine.userData.target.y = -0.5;
            splash(fishingLine.userData.target, 25);
            hookTimeout = setTimeout(() => {
                state = 'hooked'; actionBtn.innerText = 'HOOK!'; actionBtn.style.background = '#ff3333';
                splash(fishingLine.userData.target, 30); showAlert('FISH ON!', 'white');
            }, Math.random() * 3000 + 1500);
        } else showAlert('Get closer to edge!', '#ff4444');
    } else if (state === 'hooked') startMinigame();
    else if (state === 'casting') { clearTimeout(hookTimeout); resetAction(); }
}
function handleBtnUp(e) { e.preventDefault(); if (state === 'minigame') isHoldingReel = false; }

function startMinigame() {
    state = 'minigame'; actionBtn.innerText = 'HOLD REEL'; actionBtn.style.background = 'orange';
    document.getElementById('minigame-container').style.display = 'block';
    document.getElementById('progress-container').style.display = 'block';
    const rod = rods[currentRodIndex];
    let tier = Math.floor(rod.minTier + Math.pow(Math.random(), 2.5) * ((rod.maxTier - rod.minTier) + 0.99));
    tier = Math.min(tier, rod.maxTier);
    const pool = fishDatabase.filter(f => f.id === rarities[tier].id);
    targetFish = pool[Math.floor(Math.random() * pool.length)];
    barPos = 0; fishPos = 150; catchProgress = 0;
}

function catchFish() {
    state = 'popup';
    document.getElementById('minigame-container').style.display = 'none';
    document.getElementById('progress-container').style.display = 'none';
    splash(fishingLine.userData.target, 50);
    const value = Math.floor(targetFish.baseVal * (0.8 + Math.random() * 0.4));
    inventory.push({ ...targetFish, value });
    if (fishIndex[targetFish.name] === 0) totalCaughtCount++;
    fishIndex[targetFish.name]++; saveGame();
    const n = document.getElementById('caught-fish-name'); n.innerText = targetFish.name; n.className = `rarity-${targetFish.id}`;
    const r = document.getElementById('caught-fish-rarity'); r.innerText = rarities.find(x => x.id === targetFish.id).name; r.className = `rarity-${targetFish.id}`;
    document.getElementById('catch-popup').style.display = 'block';
    popupFishMesh = create3DFish(targetFish);
    const maxProp = Math.max(...targetFish.prop) * targetFish.scale;
    popupFishMesh.scale.setScalar(1.0 / maxProp);
    popupFishMesh.position.set(0, 0, -5.0);
    camera.add(popupFishMesh);
}
window.closeCatchPopup = function () {
    document.getElementById('catch-popup').style.display = 'none';
    if (popupFishMesh) { camera.remove(popupFishMesh); popupFishMesh = null; }
    resetAction();
};
function resetAction() {
    state = 'idle'; actionBtn.innerText = 'CAST'; actionBtn.style.background = 'linear-gradient(135deg,#00c6ff,#0072ff)';
    document.getElementById('minigame-container').style.display = 'none';
    document.getElementById('progress-container').style.display = 'none';
    updateHUD();
}
function updateHUD() {
    document.getElementById('money').innerText = money.toLocaleString();
    document.getElementById('current-rod').innerText = rods[currentRodIndex].name;
}
function showAlert(text, color) {
    const b = document.getElementById('alert-box'); b.innerText = text; b.style.borderColor = color; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 2000);
}
function openModal(id) { document.getElementById(id).style.display = 'block'; }
window.closeModal = function (id) { document.getElementById(id).style.display = 'none'; };

// --- SHOP ---
function openShop() {
    openModal('shop-modal');
    document.getElementById('total-caught-text').innerText = `${totalCaughtCount}/${fishDatabase.length}`;
    const sg = document.getElementById('rod-shop-grid'); sg.innerHTML = '';
    rods.forEach((r, i) => {
        const label = r.id === 'golden' ? 'Exotic Only' : `Max: ${rarities[r.maxTier].name}`;
        sg.innerHTML += `<div class="card"><h4 style="margin:5px 0;color:${r.id === 'golden' ? '#FFD700' : 'white'}">${r.name} Rod</h4><p style="font-size:12px;color:#aaa;margin:5px 0">${label}</p>${
            currentRodIndex === i ? '<button disabled>Equipped</button>' : r.owned ? `<button class="equip-btn" onclick="equipRod(${i})">Equip</button>` : `<button onclick="buyRod(${i},${r.cost})">Buy ($${r.cost.toLocaleString()})</button>`}</div>`;
    });
    const ig = document.getElementById('fish-index-grid'); ig.innerHTML = '';
    fishDatabase.forEach(f => {
        const c = fishIndex[f.name];
        ig.innerHTML += `<div class="card ${c > 0 ? `rarity-${f.id}` : ''}" style="opacity:${c > 0 ? 1 : 0.3}"><strong style="font-size:16px">${c > 0 ? f.name : '???'}</strong><br><span style="color:white;font-size:12px">Caught: ${c}</span></div>`;
    });
}
window.buyRod = function (i, cost) {
    if (money >= cost) { money -= cost; rods[i].owned = true; saveGame(); equipRod(i); showAlert('Purchased!', '#38ef7d'); }
    else showAlert('Not enough money!', '#ff4444');
};
window.equipRod = function (i) { currentRodIndex = i; buildRodModel(); saveGame(); openShop(); };

// --- MARKET ---
function openSell() {
    openModal('sell-modal');
    const g = document.getElementById('inventory-grid'); g.innerHTML = '';
    if (!inventory.length) { g.innerHTML = "<p style='color:#888;grid-column:1/-1;text-align:center'>Inventory empty.</p>"; return; }
    inventory.forEach(f => { g.innerHTML += `<div class="card rarity-${f.id}"><strong>${f.name}</strong><br><span style="color:#38ef7d">$${f.value}</span></div>`; });
}
window.sellAllFish = function () {
    if (!inventory.length) return;
    const earned = inventory.reduce((s, f) => s + f.value, 0);
    money += earned; inventory = []; saveGame(); openSell(); showAlert(`Sold for $${earned.toLocaleString()}!`, '#38ef7d');
};

// --- INIT ---
setTimeout(() => {
    const l = document.getElementById('loading-screen'); l.style.opacity = '0';
    setTimeout(() => { l.style.display = 'none'; document.getElementById('ui-layer').style.opacity = '1'; }, 800);
}, 2000);
updateHUD();

// --- MAIN LOOP ---
const clock = new THREE.Clock();
const _tip = new THREE.Vector3(), _dir = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
let bob = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1), time = clock.elapsedTime;

    waterMat.uniforms.t.value = time;
    clouds.children.forEach((c, i) => { c.position.x += dt * (1.2 + (i % 3) * 0.4); if (c.position.x > 500) c.position.x = -500; });
    lanternLights.forEach((l, i) => l.intensity = 0.55 + Math.sin(time * 7 + i * 3) * 0.08 + Math.random() * 0.04);

    // Golden rod lightning
    if (currentRodModel) {
        const bolts = currentRodModel.getObjectByName('lightningBolts');
        if (bolts) {
            bolts.visible = Math.random() > 0.4;
            if (bolts.visible) bolts.children.forEach(line => {
                const p = line.geometry.attributes.position.array;
                for (let i = 3; i < p.length - 3; i += 3) { p[i] = (Math.random() - 0.5) * 0.2; p[i + 2] = (Math.random() - 0.5) * 0.2; }
                line.geometry.attributes.position.needsUpdate = true;
            });
        }
    }

    // Movement + stations
    if (state === 'idle' || state.startsWith('near_')) {
        let mX = moveVector.x, mY = -moveVector.y;
        if (keys.w) mY = 1; if (keys.s) mY = -1; if (keys.a) mX = -1; if (keys.d) mX = 1;
        const moving = mX !== 0 || mY !== 0;
        if (moving) {
            const speed = 7 * dt;
            camera.getWorldDirection(_dir); _dir.y = 0; _dir.normalize();
            _right.crossVectors(_dir, _up).normalize();
            camera.position.addScaledVector(_dir, mY * speed).addScaledVector(_right, mX * speed);
            camera.position.x = Math.max(-9.5, Math.min(9.5, camera.position.x));
            camera.position.z = Math.max(-9.5, Math.min(9.5, camera.position.z));
            bob += dt * 10;
        }
        camera.position.y += ((moving ? 2 + Math.sin(bob) * 0.045 : 2) - camera.position.y) * Math.min(1, dt * 10);

        const cx = camera.position.x, cz = camera.position.z;
        if (Math.hypot(cx + 8, cz + 6) < 4) {
            state = 'near_shop'; actionBtn.innerText = 'SHOP'; actionBtn.style.background = '#ff4444'; msg.innerText = 'Tackle Shop'; msg.style.display = 'block';
        } else if (Math.hypot(cx - 8, cz + 6) < 4) {
            state = 'near_sell'; actionBtn.innerText = 'SELL'; actionBtn.style.background = 'linear-gradient(135deg,#11998e,#38ef7d)'; msg.innerText = 'Market'; msg.style.display = 'block';
        } else {
            if (state.startsWith('near_')) state = 'idle';
            if (state === 'idle') { actionBtn.innerText = 'CAST'; actionBtn.style.background = 'linear-gradient(135deg,#00c6ff,#0072ff)'; }
            msg.style.display = 'none';
        }
    }

    // Line, bobber, ripples
    const fishing = state === 'casting' || state === 'hooked' || state === 'minigame';
    fishingLine.visible = bobber.visible = fishing;
    ripples.forEach(r => r.visible = fishing);
    if (fishing) {
        rodTipBone.getWorldPosition(_tip);
        const tg = fishingLine.userData.target;
        const tug = state === 'minigame' ? Math.sin(time * 22) * 0.12 : state === 'hooked' ? Math.sin(time * 30) * 0.08 : 0;
        const y = -0.5 + waveH(tg.x, tg.z, time) - tug;
        bobber.position.set(tg.x, y + 0.04, tg.z);
        bobber.rotation.set(Math.sin(time * 1.7) * 0.12, 0, Math.cos(time * 1.3) * 0.12);
        const sag = state === 'minigame' ? 0.15 : state === 'hooked' ? 0.5 : 1.6;
        const p = lineGeo.attributes.position.array;
        for (let i = 0; i < LINE_PTS; i++) {
            const s = i / (LINE_PTS - 1);
            p[i * 3] = _tip.x + (tg.x - _tip.x) * s;
            p[i * 3 + 1] = _tip.y + (y + 0.15 - _tip.y) * s - 4 * sag * s * (1 - s);
            p[i * 3 + 2] = _tip.z + (tg.z - _tip.z) * s;
        }
        lineGeo.attributes.position.needsUpdate = true;
        ripples.forEach((r, i) => {
            const s = (time * (state === 'idle' ? 0.5 : 0.8) + i * 0.5) % 1;
            r.position.set(tg.x, y + 0.02, tg.z); r.scale.setScalar(0.6 + s * 3.2); r.material.opacity = (1 - s) * 0.5;
        });
    }

    // Splash particles
    for (let i = 0; i < SP_N; i++) {
        if (spLife[i] > 0) {
            spLife[i] -= dt * 1.2; spVel[i * 3 + 1] -= 9.8 * dt;
            spPos[i * 3] += spVel[i * 3] * dt; spPos[i * 3 + 1] += spVel[i * 3 + 1] * dt; spPos[i * 3 + 2] += spVel[i * 3 + 2] * dt;
            if (spLife[i] <= 0 || spPos[i * 3 + 1] < -0.6) { spLife[i] = 0; spPos[i * 3 + 1] = -100; }
        }
    }
    spGeo.attributes.position.needsUpdate = true;

    // Catch popup
    if (state === 'popup' && popupFishMesh) {
        popupFishMesh.rotation.y += 1.5 * dt;
        popupFishMesh.rotation.z = Math.sin(time * 4) * 0.08;
        popupFishMesh.position.y = Math.sin(time * 2) * 0.1;
        const tail = popupFishMesh.userData.tail; if (tail) tail.rotation.y = Math.sin(time * 9) * 0.5;
    }

    // Minigame
    if (state === 'minigame') {
        barPos += (isHoldingReel ? 250 : -250) * dt; barPos = Math.max(0, Math.min(270, barPos));
        if (Math.random() < 0.05) fishTarget = Math.random() * 330;
        fishPos += (fishTarget - fishPos) * 1.2 * dt; fishPos = Math.max(0, Math.min(342, fishPos));
        const cb = document.getElementById('catch-bar');
        if (fishPos >= barPos && fishPos <= barPos + 80) { catchProgress += 35 * dt; cb.style.borderColor = '#00ff00'; cb.style.background = 'rgba(0,255,0,.6)'; }
        else { catchProgress -= 10 * dt; cb.style.borderColor = '#ff4444'; cb.style.background = 'rgba(255,68,68,.4)'; }
        catchProgress = Math.max(0, Math.min(100, catchProgress));
        cb.style.bottom = barPos + 'px';
        document.getElementById('fish-line').style.bottom = fishPos + 'px';
        document.getElementById('progress-fill').style.height = catchProgress + '%';
        if (Math.random() < dt * 2) splash(fishingLine.userData.target, 4);
        if (catchProgress >= 100) catchFish();
    }

    shopLabel.position.y = 5.4 + Math.sin(time * 1.5) * 0.1;
    sellLabel.position.y = 4.0 + Math.sin(time * 1.5 + 1) * 0.1;
    shopLabel.lookAt(camera.position.x, shopLabel.position.y, camera.position.z);
    sellLabel.lookAt(camera.position.x, sellLabel.position.y, camera.position.z);

    sky.position.copy(camera.position);
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
</script>
</body>
</html>
